# キーエンス KV-8000 / KV-7000 / KV-Nano (Ethernet 上位リンク, ポート 8501)
#   python -m twin configs/keyence_kv8000.yaml
# PLC 側: docs/plc_io_layer.md の I/O 層を入れ、TWIN_MODE (MR000) を ON にする。
title: KV-8000 Line A
plc:
  type: keyence
  ip: 192.168.0.10
  port: 8501
  timeout: 1.0
  out: {dev: DM, addr: 1000, words: 64}   # PLC -> PC  (仮想出力 MR200〜 を BMOV で写す / 監視数値)
  in:  {dev: DM, addr: 1100, words: 64}   # PC -> PLC  (仮想センサ -> MR100〜 へ BMOV / 位置)
cycle_ms: 10
record_seconds: 300

watch:                                     # 100ms ごとに読む追加監視 (任意)
  - {dev: DM, addr: 0, words: 8}           # DM0〜DM7
  - {dev: MR, addr: 0, words: 2}           # MR000〜MR115 (ビット展開)
  - {dev: CM, addr: 700, words: 2, names: [SCAN_CUR_x10us, SCAN_MAX_x10us]}


tags:
  out:
    - {name: CONV1_RUN,  bit: "0.0", comment: Y000 相当}
    - {name: CYL1_EXT,   bit: "0.1", comment: Y001 相当}
    - {name: ST1_UP,     bit: "0.2"}
    - {name: AX1_START,  bit: "0.3"}
    - {name: AX1_TARGET, word: 10, type: s32}
    - {name: INV_HZ,     word: 16, comment: 周波数指令 x0.01Hz}
  in:
    - {name: CYL1_END,   bit: "0.0", comment: X000 相当}
    - {name: CYL1_HOME,  bit: "0.1", comment: X001 相当}
    - {name: PE1,        bit: "0.2", comment: X002 相当}
    - {name: AX1_BUSY,   bit: "0.4"}
    - {name: AX1_INPOS,  bit: "0.5"}
    - {name: AX1_POS,    word: 10, type: s32}

objects:
  - {name: conv1, type: conveyor, run: out.CONV1_RUN, length: 2000, speed: 300}
  - {name: supply, type: emitter, onto: conv1, every: 3.0, length: 60}
  - {name: PE1, type: sensor, on: conv1, at: 1500, output: in.PE1}
  - {name: ST1, type: stopper, on: conv1, at: 1560, up: out.ST1_UP}
  - {name: CYL1, type: cylinder, extend: out.CYL1_EXT, stroke: 100, time: 0.4,
     end_sensor: in.CYL1_END, home_sensor: in.CYL1_HOME, push: {conv: conv1, at: 1520, to: null}}
  - {name: AX1, type: axis, target: out.AX1_TARGET, start: out.AX1_START, speed: 400, accel: 0.3,
     pos: in.AX1_POS, busy: in.AX1_BUSY, inpos: in.AX1_INPOS, unit_scale: 100}
